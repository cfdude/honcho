# .pre-commit-config.yaml
# FORK: every local hook runs `uv run --frozen`, never bare `uv run`.
#
# Bare `uv run` REWRITES uv.lock here, and pre-commit then fails the hook with
# "files were modified by this hook" even when the tool itself reported
# "0 errors, 0 warnings". Worse, pre-commit's rollback restores the stash but NOT
# the hook's own edit, so the rewritten lockfile is left in the working tree —
# 2942 insertions / 2237 deletions on 2026-10-28, an unreviewed dependency change
# one `git add -A` away from shipping to production.
#
# The trigger is upstream's `exclude-newer = "5 days"` in pyproject.toml, which is
# not valid for uv (it wants an RFC 3339 timestamp or date). uv cannot parse it,
# concludes the timestamp cutoff was REMOVED, and re-resolves:
#   "Ignoring existing lockfile due to removal of timestamp cutoff"
# --frozen makes that impossible regardless of whether upstream ever fixes the line.
#
# This is also the root cause of the long-standing "uv run rewrites uv.lock" gotcha
# recorded in honcho-deploy/docs/server-repo-dev-gotchas.md.
repos:
  # Secret scanning. REQUIRED: `pre-commit install` overwrites
  # .git/hooks/pre-commit and destroys the `git secrets` hook that
  # ~/.git-templates installs at clone time. Without this the repo has
  # NO secret scanning at all.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  # Basic file checks (run on all files)
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-merge-conflict
      - id: debug-statements
        files: \.(py|js|ts)$
      - id: mixed-line-ending
        args: ['--fix=lf']
      # Additional checks from suggestions
      - id: check-docstring-first
        files: \.py$
      - id: check-executables-have-shebangs
      - id: check-case-conflict

  # Python code formatting and linting with ruff
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.12
    hooks:
      # Linter - only on Python directories
      - id: ruff-check
        args: [--fix]
        files: ^(src/|tests/|scripts/|migrations/|sdks/python/|sandbox/).*\.py$
      # Formatter - only on Python directories
      - id: ruff-format
        files: ^(src/|tests/|scripts/|migrations/|sdks/python/|sandbox/).*\.py$

  # Security checks - only on main src code (not tests/scripts)
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.10
    hooks:
      - id: bandit
        args: ['-r']
        files: ^(src/|sdks/python/src/).*\.py$

  # Local hooks using your uv environment
  - repo: local
    hooks:
      # TypeScript linting with biome
      - id: biome-check
        name: biome check and format
        entry: bash -c 'cd sdks/typescript && bun run lint:fix'
        language: system
        files: ^sdks/typescript/.*\.(js|ts|jsx|tsx|json|jsonc)$
        pass_filenames: false

      # Type checking with basedpyright - only on main Python code
      - id: basedpyright
        name: basedpyright
        entry: uv run --frozen basedpyright
        language: system
        files: ^(src/|tests/|sdks/python/|scripts/).*\.py$
        require_serial: true
        pass_filenames: true

      # Run main application tests
      - id: pytest-main
        name: pytest (main app)
        entry: uv run --frozen pytest -x tests/ --ignore=tests/alembic/
        language: system
        files: ^(src/|tests/).*\.py$
        stages: [pre-push]
        pass_filenames: false

      # Run Alembic tests only when migrations change
      - id: pytest-alembic
        name: pytest (alembic migrations)
        entry: uv run --frozen python scripts/run_alembic_tests.py
        language: system
        files: ^(migrations/versions/.*\.py|tests/alembic/.*\.py)$
        stages: [pre-push]
        pass_filenames: true
        require_serial: true

      # Ensure each alembic migration revision has a corresponding test file
      - id: ensure-alembic-coverage
        name: ensure alembic migration test coverage
        entry: uv run --frozen python scripts/ensure_alembic_tests.py
        language: system
        files: ^(migrations/versions/.*\.py|tests/alembic/revisions/.*\.py)$
        stages: [pre-push]
        pass_filenames: false

      # Ensure the alembic migration graph has a single head
      - id: check-alembic-heads
        name: check alembic migrations have a single head
        entry: uv run --frozen python scripts/check_alembic_heads.py
        language: system
        files: ^migrations/versions/.*\.py$
        stages: [pre-push]
        pass_filenames: false

      # Run Python SDK tests (if they exist)
      - id: pytest-python-sdk
        name: pytest (Python SDK)
        entry: bash -c 'if [ -d "sdks/python/tests" ]; then cd sdks/python && uv run pytest; fi'
        language: system
        files: ^sdks/python/.*\.py$
        stages: [pre-push]
        pass_filenames: false

      # TypeScript SDK tests against a throwaway API + mock LLM provider
      - id: typescript-sdk-tests
        name: TypeScript SDK tests
        entry: bash -c 'cd sdks/typescript && bun run test'
        language: system
        files: ^(sdks/typescript/(src|__tests__)/.*\.ts|scripts/run_ts_sdk_tests\.py)$
        stages: [pre-push]
        pass_filenames: false

      # TypeScript build with bun
      - id: typescript-check
        name: TypeScript build
        entry: bash -c 'if [ -f "sdks/typescript/package.json" ]; then cd sdks/typescript && bun run build; fi'
        language: system
        files: ^sdks/typescript/.*\.(js|ts|jsx|tsx|json)$
        stages: [pre-push]
        pass_filenames: false

      # TypeScript type checking with bun
      - id: typescript-typecheck
        name: TypeScript type check
        entry: bash -c 'if [ -f "sdks/typescript/package.json" ]; then cd sdks/typescript && bun run typecheck; fi'
        language: system
        files: ^sdks/typescript/.*\.(ts|tsx)$
        pass_filenames: false

  # Documentation linting
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.37.0
    hooks:
      - id: markdownlint
        args: ['--fix']
        files: \.(md|mdx)$
        # FORK: generated files are excluded. `openspec update` owns
        # .claude/skills/openspec-*/ and .claude/commands/opsx/ and rewrites them
        # in place from upstream templates, so --fix here is worse than useless:
        # it edits files we do not author, the edits are destroyed on the next
        # regeneration, and in the meantime they diverge from the template. One
        # regeneration arrived carrying 4 MD036/MD033 violations and --fix wrote
        # 47 lines into seven files, blocking the commit either way.
        exclude: ^\.claude/(skills/openspec-|commands/opsx/)

  # Commit message linting
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v3.13.0
    hooks:
      - id: commitizen
        stages: [commit-msg]
