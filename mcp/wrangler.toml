name = "honcho-mcp"
main = "src/index.ts"
compatibility_date = "2024-12-09"
compatibility_flags = ["nodejs_compat"]

# Bundle Markdown (e.g. instructions.md) as text strings so it can be imported.
rules = [
  { type = "Text", globs = ["**/*.md"], fallthrough = true },
]

# Executes the scheduled() handler
[triggers]
crons = ["*/5 * * * *"]

[env.production]
name = "honcho-mcp"

[env.staging]
name = "honcho-mcp-staging"
# FORK: served from a custom domain on onvex.io, not workers.dev, so Cloudflare
# Access can be applied to it — Access cannot protect a *.workers.dev hostname
# because that zone belongs to Cloudflare, not to us. workers_dev is disabled
# so the unprotected .workers.dev route is not left open as a way around it.
# The Access application itself is Terraform, in
# honcho-deploy/infra/cloudflare/main.tf.
workers_dev = false
routes = [
  { pattern = "honcho-mcp-staging.onvex.io", custom_domain = true },
]

[observability.logs]
enabled = true
